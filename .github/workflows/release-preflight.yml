name: Release Preflight

on:
  push:
    branches:
      - beta
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      enforce_final_suite:
        description: "Require the reviewed frozen suite lock (release gate)"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Provision pinned media probe runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssl
          mkdir -p "$RUNNER_TEMP/ffmpeg-runtime"
          cd "$RUNNER_TEMP/ffmpeg-runtime"
          curl -L --fail --silent --show-error -o ffmpeg-linux.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
          echo "bf877874d030e0dfca62a78b1730feaa01b5938285b5aefe9438a8f20187ecef  ffmpeg-linux.tar.xz" | shasum -a 256 -c -
          tar -xf ffmpeg-linux.tar.xz
          bundle_dir="$(find "$PWD" -mindepth 1 -maxdepth 1 -type d -name 'ffmpeg-*' -print -quit)"
          test -x "$bundle_dir/bin/ffmpeg"
          test -x "$bundle_dir/bin/ffprobe"
          echo "FFMPEG_EXE=$bundle_dir/bin/ffmpeg" >> "$GITHUB_ENV"
          echo "FFPROBE_EXE=$bundle_dir/bin/ffprobe" >> "$GITHUB_ENV"
      - name: Generate ignored dev TLS cert
        run: bash scripts/generate-dev-cert.sh
      - name: Run release preflight
        env:
          ENFORCE_FINAL_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.enforce_final_suite || 'false' }}
        run: |
          checks=(hygiene metadata frontend server client stack-smoke migrations production-compose suite-contract ops-hooks)
          if [ "$ENFORCE_FINAL_SUITE" = "true" ]; then
            checks+=(final-suite)
          fi
          bash scripts/release_preflight.sh "${checks[@]}"

  release-sentinel:
    name: Release sentinel (FINAL_TEST_SUITE_NOT_FROZEN expected pre-freeze)
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Surface the intentional final-suite blocker
        run: |
          set +e
          output="$(bash scripts/release_preflight.sh final-suite 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Final suite is frozen; the expected pre-freeze sentinel is cleared."
            exit 0
          fi
          grep -Fxq 'FAIL FINAL_TEST_SUITE_NOT_FROZEN' <<<"$output"
