name: API Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
    steps:
      - name: Check required configuration
        id: configuration
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -n "${API_BASE_URL:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::API_BASE_URL is required for a manually dispatched smoke test."
            exit 1
          fi

          echo "::notice::Skipping the scheduled smoke test because API_BASE_URL is not configured."

      - name: Checkout
        if: ${{ steps.configuration.outputs.configured == 'true' }}
        uses: actions/checkout@v6

      - name: Setup curl and jq
        if: ${{ steps.configuration.outputs.configured == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Health check
        if: ${{ steps.configuration.outputs.configured == 'true' }}
        run: |
          set -euo pipefail
          curl -fsSL "$API_BASE_URL/health/ready" | jq .

      - name: Query should return JSON array
        if: ${{ steps.configuration.outputs.configured == 'true' }}
        run: |
          set -euo pipefail
          curl -fsSL "$API_BASE_URL/query" | jq -e 'type == "array"' >/dev/null

      - name: Submit sample (optional)
        if: ${{ steps.configuration.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          payload=$(jq -nc '{
            cpuModel: "CI Runner",
            gpuModel: null,
            ramGB: 4,
            os: "ubuntu",
            codec: "h264",
            preset: "medium",
            fps: 1.23,
            vmaf: 90,
            fileSizeBytes: 12345,
            notes: "smoke"
          }')
          curl -fsSL -X POST "$API_BASE_URL/submit" \
            -H "Content-Type: application/json" \
            -d "$payload" | jq .

      - name: Validation and method guard
        if: ${{ steps.configuration.outputs.configured == 'true' }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$API_BASE_URL/submit" -H "Content-Type: application/json" -d '{}')
          test "$code" = "400"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$API_BASE_URL/submit")
          test "$code" = "405"
