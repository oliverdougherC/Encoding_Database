name: API Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check readiness, query, and submission guards
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ -z "$API_BASE_URL" ]]; then
            if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
              echo "::error::API_BASE_URL is required for a manually dispatched smoke test."
              exit 1
            fi
            echo "::notice::Skipping the scheduled smoke test because API_BASE_URL is not configured."
            exit 0
          fi

          api_base="$API_BASE_URL"
          while [[ "$api_base" == */ ]]; do api_base="${api_base%/}"; done
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          ready_url="$(curl -fsSL --max-time 20 --proto-redir '=https' \
            --output "$response" --write-out '%{url_effective}' "$api_base/health/ready")"
          jq -e '.status == "ok"' "$response" >/dev/null
          if [[ "$ready_url" != https://*/health/ready ]]; then
            echo "::error::Expected readiness at an HTTPS /health/ready endpoint."
            exit 1
          fi
          api_base="${ready_url%/health/ready}"
          curl -fsS --max-time 20 "$api_base/query" | jq -e 'type == "array"' >/dev/null

          expect_status() {
            local expected="$1" status
            shift
            status="$(curl --silent --show-error --max-time 20 --output /dev/null \
              --write-out '%{http_code}' "$@" "$api_base/submit")"
            if [[ "$status" != "$expected" ]]; then
              echo "::error::Expected HTTP $expected from /submit, got $status."
              return 1
            fi
          }
          expect_status 400 -H 'Content-Type: application/json' -d '{}'
          expect_status 405
