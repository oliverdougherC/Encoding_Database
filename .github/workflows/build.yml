name: CI

on:
  push:
    branches:
      - main
      - beta
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        env:
          ENABLE_QUERY_MOCK: "1"
        run: npm run build

  server:
    name: server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install media probe runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Test
        working-directory: server
        run: npm test

  client:
    name: client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install media probe runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install client test dependencies
        working-directory: client
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Client tests
        working-directory: client
        run: python -m pytest -q

  migration:
    name: migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: benchmarks
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U app -d benchmarks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/benchmarks?schema=public
      PRISMA_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Prisma generate
        working-directory: server
        run: npx prisma generate
      - name: Prisma migrate deploy
        working-directory: server
        run: npx prisma migrate deploy
      - name: Prisma migration status
        working-directory: server
        run: npx prisma migrate status
      - name: Verify concurrent null-workload uniqueness
        working-directory: server
        run: node scripts/verify-legacy-null-workload-concurrency.mjs

  stack-smoke:
    name: stack-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install media probe runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run end-to-end smoke harness
        run: bash scripts/test.sh
