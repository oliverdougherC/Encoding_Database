name: CI

on:
  push:
    branches:
      - main
      - beta
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  server:
    name: server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install media probe runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Test
        working-directory: server
        run: npm test

  client:
    name: client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Provision pinned FFmpeg runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ffmpeg-runtime"
          cd "$RUNNER_TEMP/ffmpeg-runtime"
          curl -L --fail --silent --show-error -o ffmpeg-linux.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
          echo "bf877874d030e0dfca62a78b1730feaa01b5938285b5aefe9438a8f20187ecef  ffmpeg-linux.tar.xz" | shasum -a 256 -c -
          tar -xf ffmpeg-linux.tar.xz
          bundle_dir="$(find "$PWD" -mindepth 1 -maxdepth 1 -type d -name 'ffmpeg-*' -print -quit)"
          test -x "$bundle_dir/bin/ffmpeg"
          test -x "$bundle_dir/bin/ffprobe"
          echo "FFMPEG_EXE=$bundle_dir/bin/ffmpeg" >> "$GITHUB_ENV"
          echo "FFPROBE_EXE=$bundle_dir/bin/ffprobe" >> "$GITHUB_ENV"
      - name: Install client test dependencies
        working-directory: client
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Client tests
        working-directory: client
        run: python -m pytest -q

  client-native-linux-build:
    name: client-native-linux-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENCODINGDB_BUILD_ONLY: "1"
      ENCODINGDB_REGISTER_RUNTIME: "1"
      ENCODINGDB_RUNTIME_LOCK_PATH: ${{ github.workspace }}/ffmpeg-lock.linux.json
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Provision pinned FFmpeg runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ffmpeg-runtime"
          cd "$RUNNER_TEMP/ffmpeg-runtime"
          curl -L --fail --silent --show-error -o ffmpeg-linux.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
          echo "bf877874d030e0dfca62a78b1730feaa01b5938285b5aefe9438a8f20187ecef  ffmpeg-linux.tar.xz" | shasum -a 256 -c -
          tar -xf ffmpeg-linux.tar.xz
          bundle_dir="$(find "$PWD" -mindepth 1 -maxdepth 1 -type d -name 'ffmpeg-*' -print -quit)"
          test -x "$bundle_dir/bin/ffmpeg"
          test -x "$bundle_dir/bin/ffprobe"
          echo "ENCODINGDB_FFMPEG_PATH=$bundle_dir/bin/ffmpeg" >> "$GITHUB_ENV"
          echo "ENCODINGDB_FFPROBE_PATH=$bundle_dir/bin/ffprobe" >> "$GITHUB_ENV"
      - name: Run native Linux client build
        run: bash scripts/build_linux_client.sh

  client-native-macos-build:
    name: client-native-macos-build
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ENCODINGDB_BUILD_ONLY: "1"
      ENCODINGDB_REGISTER_RUNTIME: "1"
      ENCODINGDB_RUNTIME_LOCK_PATH: ${{ github.workspace }}/ffmpeg-lock.macos.json
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Provision signature-verified FFmpeg runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ffmpeg-runtime"
          cd "$RUNNER_TEMP/ffmpeg-runtime"
          curl -L --fail --silent --show-error https://evermeet.cx/ffmpeg/0x1A660874.asc | gpg --import
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request
          out = pathlib.Path(".")
          for tool in ("ffmpeg", "ffprobe"):
              with urllib.request.urlopen(f"https://evermeet.cx/ffmpeg/info/{tool}/snapshot", timeout=20) as response:
                  payload = json.load(response)
              out.joinpath(f"{tool}.zip").write_bytes(
                  urllib.request.urlopen(payload["download"]["zip"]["url"], timeout=60).read()
              )
              out.joinpath(f"{tool}.zip.sig").write_bytes(
                  urllib.request.urlopen(payload["download"]["zip"]["sig"], timeout=60).read()
              )
          PY
          gpg --verify ffmpeg.zip.sig ffmpeg.zip
          gpg --verify ffprobe.zip.sig ffprobe.zip
          unzip -q ffmpeg.zip
          unzip -q ffprobe.zip
          test -x "$PWD/ffmpeg"
          test -x "$PWD/ffprobe"
          echo "ENCODINGDB_FFMPEG_PATH=$PWD/ffmpeg" >> "$GITHUB_ENV"
          echo "ENCODINGDB_FFPROBE_PATH=$PWD/ffprobe" >> "$GITHUB_ENV"
      - name: Run native macOS client build
        run: bash scripts/build_macos_client.sh

  client-native-windows-build:
    name: client-native-windows-build
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ENCODINGDB_BUILD_ONLY: "1"
      ENCODINGDB_REGISTER_RUNTIME: "1"
      ENCODINGDB_RUNTIME_LOCK_PATH: ${{ github.workspace }}\ffmpeg-lock.windows.json
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Provision pinned FFmpeg runtime
        shell: pwsh
        run: |
          $runtimeDir = Join-Path $env:RUNNER_TEMP "ffmpeg-runtime"
          New-Item -ItemType Directory -Path $runtimeDir -Force | Out-Null
          $archive = Join-Path $runtimeDir "ffmpeg-win.zip"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-n8.1-latest-win64-gpl-8.1.zip" -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne "642a86269f3b03d8f47f058ec9357fd93b6930018a4003092179b2c7116179b9") {
            throw "Unexpected FFmpeg archive hash: $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $runtimeDir -Force
          $bundleDir = Get-ChildItem -LiteralPath $runtimeDir -Directory | Where-Object { $_.Name -like "ffmpeg-*" } | Select-Object -First 1
          if (-not $bundleDir) { throw "Expanded FFmpeg bundle directory not found" }
          $ffmpeg = Join-Path $bundleDir.FullName "bin\\ffmpeg.exe"
          $ffprobe = Join-Path $bundleDir.FullName "bin\\ffprobe.exe"
          if (-not (Test-Path -LiteralPath $ffmpeg)) { throw "ffmpeg.exe missing from bundle" }
          if (-not (Test-Path -LiteralPath $ffprobe)) { throw "ffprobe.exe missing from bundle" }
          "ENCODINGDB_FFMPEG_PATH=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ENCODINGDB_FFPROBE_PATH=$ffprobe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run native Windows client build
        shell: pwsh
        run: ./scripts/build_windows_client.ps1

  migration:
    name: migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: benchmarks
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U app -d benchmarks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/benchmarks?schema=public
      PRISMA_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Prisma generate
        working-directory: server
        run: npx prisma generate
      - name: Prisma migrate deploy
        working-directory: server
        run: npx prisma migrate deploy
      - name: Prisma migration status
        working-directory: server
        run: npx prisma migrate status
      - name: Verify concurrent null-workload uniqueness
        working-directory: server
        run: node scripts/verify-legacy-null-workload-concurrency.mjs

  stack-smoke:
    name: stack-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Provision pinned FFmpeg runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ffmpeg-runtime"
          cd "$RUNNER_TEMP/ffmpeg-runtime"
          curl -L --fail --silent --show-error -o ffmpeg-linux.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
          echo "bf877874d030e0dfca62a78b1730feaa01b5938285b5aefe9438a8f20187ecef  ffmpeg-linux.tar.xz" | shasum -a 256 -c -
          tar -xf ffmpeg-linux.tar.xz
          bundle_dir="$(find "$PWD" -mindepth 1 -maxdepth 1 -type d -name 'ffmpeg-*' -print -quit)"
          test -x "$bundle_dir/bin/ffmpeg"
          test -x "$bundle_dir/bin/ffprobe"
          echo "FFMPEG_EXE=$bundle_dir/bin/ffmpeg" >> "$GITHUB_ENV"
          echo "FFPROBE_EXE=$bundle_dir/bin/ffprobe" >> "$GITHUB_ENV"
      - name: Run end-to-end smoke harness
        run: bash scripts/test.sh
